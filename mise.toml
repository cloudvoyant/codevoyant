[env]
_.path   = ['{{config_root}}/node_modules/.bin']
PROJECT  = "claudevoyant"
VERSION  = "{{exec(command='cat version.txt 2>/dev/null | tr -d \"[:space:]\" || echo 0.0.0')}}"

[tools]
node       = "lts"
pnpm       = "10"
bats       = "latest"
shellcheck = "latest"
shfmt      = "latest"
gh         = "latest"
glab       = "latest"
"npm:skills-ref" = "0.1.5"

# ==============================================================================
# DOCS
# ==============================================================================

[tasks.docs]
description = "Start local docs dev server"
run         = "pnpm run docs:dev"

[tasks."docs:build"]
description = "Build docs site"
run         = "pnpm run docs:build"

[tasks."docs:preview"]
description = "Preview built docs"
run         = "pnpm run docs:preview"

[tasks.favicons]
description = "Generate favicons from SVGs in docs/public/"
run         = ".mise-tasks/favicons"

# ==============================================================================
# CI/CD
# ==============================================================================

[tasks.install]
description = "Install all workspace dependencies"
run         = "pnpm install"

[tasks.version]
description = "Print current version"
run         = "cat version.txt"

[tasks.upversion]
description = "Run semantic-release to version and update changelog"
run         = ".mise-tasks/upversion"

# ==============================================================================
# SKILLS
# ==============================================================================

[tasks."skills:validate"]
description = "Validate all SKILL.md files against the Agent Skills base spec"
run = """
#!/usr/bin/env bash
set -euo pipefail
failed=0
count=0
while IFS= read -r f; do
  count=$((count + 1))
  output=$(skills-ref read-properties "$f" 2>&1) || { echo "FAIL: $f"; echo "  $output"; failed=$((failed + 1)); continue; }
  missing=""
  for field in name description license compatibility; do
    if ! echo "$output" | grep -q "\"$field\""; then
      missing="$missing $field"
    fi
  done
  if [ -n "$missing" ]; then
    echo "FAIL: $f — missing required field(s):$missing"
    failed=$((failed + 1))
  else
    echo "PASS: $f"
  fi
done < <(find ./skills -name 'SKILL.md' | sort)
echo ""
echo "$count skills checked, $failed failed."
if [ "$failed" -gt 0 ]; then exit 1; fi
echo "All skills passed validation."

# Soft-wrap rule presence: every SKILL.md dispatcher, every agent file, and every
# workflow file that generates a markdown artifact must declare the canonical
# rule. The repo has no prettier/markdownlint setup, so the rule in skill
# instructions plus this presence gate is the enforcement. The check requires the
# exact canonical phrase ("soft-wrap prose, never hard-wrap") so an incidental
# mention (e.g. "do not soft-wrap code fences") can't satisfy the gate.
soft_failed=0
check_soft_wrap() {
  if ! grep -qF "soft-wrap prose, never hard-wrap" "$1"; then
    echo "FAIL: $1 — missing 'soft-wrap prose, never hard-wrap' rule"
    soft_failed=$((soft_failed + 1))
  fi
}
while IFS= read -r f; do check_soft_wrap "$f"; done < <(find ./skills -name 'SKILL.md' -not -path '*/references/examples/*' | sort; find ./skills -path '*/agents/*.md' | sort)
# Reference files that generate markdown artifacts (.md/.mdx/SKILL.md output)
# must carry the rule too; help.md / run.md (command reference only) and
# templates/ (fill-in data) never generate prose artifacts and are excluded.
while IFS= read -r f; do check_soft_wrap "$f"; done < <(find ./skills -path '*/references/*.md' -not -path '*/references/examples/*' -not -path '*/references/templates/*' -not -name 'help.md' -not -name 'run.md' -exec grep -lE '(write|create|generate|emit|author|produce|draft|save|scaffold)[^.;]{0,80}\\.(md|mdx|SKILL\\.md)' {} + | sort)
if [ "$soft_failed" -gt 0 ]; then
  echo "$soft_failed file(s) missing the soft-wrap rule"
  exit 1
fi
echo "Soft-wrap rule present in all SKILL.md, agent, and markdown-generating workflow files."

# Vendor drift: every destination in skills/vendor.json must match its shared source.
"$MISE_PROJECT_ROOT/.mise-tasks/vendor-assets" --check

# Model-ID guard: no hardcoded provider model ID in a model context. Matches
# "**Model:** claude-*" / "model: claude-*" (and gpt-/deepseek- equivalents);
# MCP tool names like mcp__claude-in-chrome__* are not matched. The literal
# asterisks are written as [*] character classes -- no backslash escaping, so
# the pattern survives TOML string decoding unchanged.
model_failed=0
while IFS= read -r hit; do
  echo "FAIL: hardcoded provider model ID: $hit"
  model_failed=$((model_failed + 1))
done < <(rg -n '([*][*]Model:[*][*]|model:)[[:space:]]*(claude-|gpt-|deepseek-)' skills --glob '*.md' --glob '*.json' 2>/dev/null || true)
# A bare "model:" field in an agent's frontmatter (e.g. "model: inherit") or a
# bare "**Model:**" header line is a harness-specific declaration, not a model
# tier; agents must use "metadata: model-tier:" or "**Model tier:**". Flag both
# at line start so MCP tool names (which never begin a line with "model:") and
# the legitimate "**Model tier:**" header stay untouched.
while IFS= read -r hit; do
  echo "FAIL: agent file uses bare 'model:' field or '**Model:**' header (use 'metadata: model-tier:' / '**Model tier:**'): $hit"
  model_failed=$((model_failed + 1))
done < <(rg -n '^(model:|[*][*]Model:[*][*])[[:space:]]+' skills --glob '**/agents/*.md' 2>/dev/null || true)
if [ "$model_failed" -gt 0 ]; then
  echo "$model_failed hardcoded provider model ID / bare model field(s) found"
  exit 1
fi
echo "No hardcoded provider model IDs or bare model: fields in skills."
"""

[tasks."skills:install"]
description = "Install/update all skills from remote (cloudvoyant/codevoyant)"
run = "npx skills add cloudvoyant/codevoyant -g --all -y"

[tasks."skills:vendor"]
description = "Vendor shared assets (skills/vendor.json) into skill directories"
run = ".mise-tasks/vendor-assets"
